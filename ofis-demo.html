<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1220;--panel:#0f182a;--line:#1e2a40;--tx:#e7edf7;--mut:#8a98b0;--blue:#4f8cff;--green:#22c55e;--amber:#f5b40b;--gray:#8b95a7}
body{width:1440px;height:900px;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Inter,Arial,sans-serif;overflow:hidden}
.top{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);background:linear-gradient(#0e1729,#0b1322)}
.lg{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800;letter-spacing:.2px}
.lg i{width:36px;height:36px;border-radius:50%;background:conic-gradient(from 200deg,#3a6cf0,#1ca078,#5ad1ff,#3a6cf0);display:block;position:relative;box-shadow:0 0 18px #3a6cf088}
.lg i:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#0e1729}
.lg span{font-weight:400;color:#7fb0ff}
.sub{color:#7f93b5;font-size:13px}
.pill{margin-left:auto;border:1px solid #2a3a58;border-radius:11px;padding:8px 14px;font-size:13.5px;display:flex;align-items:center;gap:8px;background:#0f1a2e}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
.quote{color:#c8d3e6;font-size:14px;margin-left:40px;font-style:italic}
.dt{color:#a9b6cc;font-size:13px;margin-left:40px}
.av{width:38px;height:38px;border-radius:50%;background:#2f6fe0;display:grid;place-items:center;font-weight:700;border:2px solid #2a3a58}
.nav{position:absolute;left:0;top:64px;bottom:0;width:92px;border-right:1px solid var(--line);background:#0c1424;padding-top:12px}
.nav div{height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#8fa0bd;font-size:12.5px}
.nav div.on{background:linear-gradient(90deg,#1a2b4d,#13203a);color:#fff;box-shadow:inset 3px 0 0 var(--blue)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .by{position:absolute;bottom:18px;left:0;right:0;height:auto;font-size:11px;color:#55647e}
#stage{position:absolute;left:92px;top:64px;width:988px;height:760px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#16233c 0%,#0b1220 70%)}
.bot{position:absolute;left:92px;width:988px;bottom:0;height:76px;border-top:1px solid var(--line);display:flex;align-items:center;background:#0c1424}
.bot>div{flex:1;display:flex;align-items:center;gap:12px;padding:0 26px;border-right:1px solid var(--line);height:46px}
.bot b{font-size:21px;display:block;line-height:1}.bot small{color:var(--mut);font-size:12.5px}
.bot .q{flex:1.6;color:#c8d3e6;font-style:italic;font-size:14px;justify-content:center;border:0}
.side{position:absolute;right:0;top:64px;bottom:0;width:360px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.tabs{display:flex;gap:8px;padding:14px 14px 10px}
.tabs b{flex:1;text-align:center;padding:11px;border-radius:11px;font-weight:600;font-size:14px;color:#9fb0cc;border:1px solid transparent}
.tabs b.on{background:#13264a;border-color:#2c4f8f;color:#fff;box-shadow:inset 0 -2px 0 var(--blue)}
.ch{padding:6px 18px 10px;font-size:16px;color:#cfe0ff;border-bottom:1px solid var(--line)}
.ch span{color:var(--blue)}
#feed{flex:1;overflow:hidden;padding:8px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.it{display:flex;gap:11px;padding:9px 6px;border-radius:12px;animation:in .5s ease-out}
.it .fa{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;background:#1b2a44}
.it .fa svg{width:40px;height:40px}
.it h5{font-size:14px;font-weight:700}.it h5 small{color:var(--mut);font-weight:400;margin-left:8px;font-size:12px}
.it p{font-size:13px;color:#b9c6da;line-height:1.4;margin-top:2px}
.it.me{background:#13264a}
.st{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;padding:3px 10px;border-radius:9px;border:1px solid}
.st i{width:8px;height:8px;border-radius:50%;display:block}
.s1{color:#7ee2a2;border-color:#1f6b40;background:#0f2a1c}.s1 i{background:var(--green)}
.s2{color:#ffd56b;border-color:#7a5a10;background:#2a2108}.s2 i{background:var(--amber)}
.s3{color:#b8c1d1;border-color:#3a4558;background:#1a2232}.s3 i{background:var(--gray)}
.inp{margin:12px 14px 16px;border:1px solid #2a3a58;border-radius:13px;padding:13px 14px;color:#7f8fab;font-size:14px;display:flex;justify-content:space-between;align-items:center;background:#0c1526}
.inp b{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* sahne animasyonları */
@keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.3px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-36px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.8}}
@keyframes flick{0%,100%{opacity:.9}47%{opacity:.9}50%{opacity:.6}53%{opacity:.9}}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-12px)}}
@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes sdot{0%,100%{opacity:1}50%{opacity:.35}}
.ha{animation:type .3s ease-in-out infinite}.hb{animation:type .3s ease-in-out infinite reverse}
.br{animation:breathe 2.4s ease-in-out infinite}
.fl{animation:floaty 2.2s ease-in-out infinite}
.sw{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s ease-in-out infinite}
.sc{animation:scroll 2.4s linear infinite}
.gl{animation:glow 3s ease-in-out infinite}
.fk{animation:flick 5s infinite}
.stm{animation:steam 2s ease-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 2.2s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
.sd{animation:sdot 1.4s infinite}
.bub{transition:opacity .4s}
.otb{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;padding:14px 18px;z-index:2}
.otb b{font-weight:600;font-size:13.5px;border:1px solid #2c4f8f;background:#13264a;border-radius:9px;padding:8px 13px}
.otb b.blue{background:#2f6fe0;border-color:#2f6fe0}.otb b.press{animation:press .9s ease-in-out 2;box-shadow:0 0 0 4px #5aa0ff66}
@keyframes press{50%{transform:scale(.93)}}
.opill{border:1px solid #2a3a58;border-radius:10px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:7px;background:#0f1a2e}
.opill i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 7px #22c55e}
#stage svg{position:absolute;inset:0}
html{overflow:hidden;background:#0b1220}body{transform-origin:0 0}
</style></head><body>
<div class="top">
 <div class="lg"><i></i>DeskCrew AI <span>Office</span></div>
 <div class="sub"><span class="tt" data-en="› You say it, your team does it.">› Sen söyle, ekibin halletsin.</span></div>
 <span id="act" hidden></span><span style="margin-left:auto"></span>
 <div class="quote"><span class="tt" data-en="“Work that runs itself.”">“İşler kendiliğinden yürüyor.”</span></div>
 <div class="dt"><span class="tt" data-en="4 Oct 2026">4 Eki 2026</span> &nbsp; <span id="clk">10:24</span></div>
 <div class="av">A</div>
</div>
<div class="nav">
 <div class="on"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="10" height="18"/><path d="M14 9h6v12h-6M7 7h4M7 11h4M7 15h4"/></svg><span class="tt" data-en="Office">Ofis</span></div>
 <div><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="tt" data-en="Chat">Sohbet</span></div>
 <div><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg><span class="tt" data-en="Tasks">Görevler</span></div>
 <div><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span class="tt" data-en="Activity">Etkinlik</span></div>
 <div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span class="tt" data-en="Settings">Ayarlar</span></div>
 <div class="by">by alberbehar</div>
</div>
<div id="stage"><div class="otb"><span class="opill"><i></i><span id="act2"></span></span><span style="flex:1"></span><b class="tt" data-en="+ Add room">+ Oda ekle</b><b class="tt" data-en="+ Hire">+ Çalışan al</b><b class="blue" id="meetBtn">📅 <span class="tt" data-en="Hold a meeting">Toplantı yap</span></b></div><svg id="sv" width="988" height="760" viewBox="0 0 988 760"></svg></div>
<div class="bot">
 <div><svg width="28" height="28" viewBox="0 0 24 24" fill="#4f8cff"><circle cx="9" cy="8" r="4"/><path d="M1 21c0-5 4-7 8-7s8 2 8 7z"/><circle cx="17" cy="9" r="3" opacity=".7"/></svg><span><b>6</b><small><span class="tt" data-en="AI team members">AI çalışan</span></small></span></div>
 <div><span class="dot" style="background:var(--green)"></span><span><b id="c1">4</b><small><span class="tt" data-en="Working">Çalışıyor</span></small></span></div>
 <div><span class="dot" style="background:var(--amber);box-shadow:0 0 8px var(--amber)"></span><span><b id="c2">1</b><small><span class="tt" data-en="Following">Takipte</span></small></span></div>
 <div><span class="dot" style="background:var(--gray);box-shadow:none;animation:none"></span><span><b id="c3">1</b><small><span class="tt" data-en="Idle">Boşta</span></small></span></div>
 <div class="q"><span class="tt" data-en="“You say it, the team does it.”">“Sen söyle, ekip halletsin.”</span></div>
</div>
<div class="side">
 <div class="tabs"><b class="on">💬 <span class="tt" data-en="Chat">Sohbet</span></b><b>☰ <span class="tt" data-en="Tasks">Görevler</span></b></div>
 <div class="ch"><span>#</span> <span class="tt" data-en="general">genel</span></div>
 <div id="feed"></div>
 <div class="inp"><span class="tt" data-en="Message the team…">Ekibe yaz…</span> <b>➤</b></div>
</div>
<script>
const EN=new URLSearchParams(location.search).get("lang")==="en"; const t=(a,b)=>EN?b:a;
if(EN) document.querySelectorAll(".tt").forEach(e=>e.textContent=e.dataset.en);
const C=.866, s=28, OX=404, OY=112;
const P=(x,y,z=0)=>[OX+(x-y)*C*s, OY+(x+y)*.5*s - z*s];
const pts=a=>a.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
let H="";
const poly=(a,f,ex="")=>`<polygon points="${pts(a)}" fill="${f}" ${ex}/>`;
function box(x,y,z,w,d,h,top,left,right,ex=""){ // left = +y yüzü, right = +x yüzü
 return poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],left,ex)+
        poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],right,ex)+
        poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],top,ex) }
const shade=(hex,k)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r*k);g=Math.round(g*k);b=Math.round(b*k);return `rgb(${Math.min(r,255)},${Math.min(g,255)},${Math.min(b,255)})`}
const cbox=(x,y,z,w,d,h,c,ex)=>box(x,y,z,w,d,h,shade(c,1.15),shade(c,.8),shade(c,.62),ex);
// y=sabit düzleminde (x yönünde akan) yazı/öğe dönüşümü
const onY=(x,y,z)=>{const [a,b]=P(x,y,z);return `matrix(${C},0.5,0,1,${a},${b})`};
const onX=(x,y,z)=>{const [a,b]=P(x,y,z);return `matrix(${C},-0.5,0,1,${a},${b})`};

// ---------- defs ----------
H+=`<defs>
<radialGradient id="warm"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
<radialGradient id="cool"><stop offset="0" stop-color="#5aa0ff" stop-opacity=".5"/><stop offset="1" stop-color="#5aa0ff" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="bl8"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b3a"/><stop offset="1" stop-color="#1f3766"/></linearGradient>
</defs>`;

// ---------- zemin ----------
H+=box(-.3,-.3,-.5,24.6,16.6,.5,"#2a2420","#141b2b","#101726");
const floor=(x0,y0,x1,y1,c)=>poly([P(x0,y0),P(x1,y0),P(x1,y1),P(x0,y1)],c);
H+=floor(0,0,24,16,"#5b4532");
for(let i=0;i<=24;i+=1) H+=`<line x1="${P(i,0)[0]}" y1="${P(i,0)[1]}" x2="${P(i,16)[0]}" y2="${P(i,16)[1]}" stroke="#4b382a" stroke-width="1"/>`;
[[4,4],[12,4],[20,4],[4,12],[12,12],[20,12]].forEach(([x,y])=>{const [a,b]=P(x,y);H+=`<ellipse cx="${a}" cy="${b}" rx="150" ry="80" fill="url(#warm)" opacity=".55"/>`});
H+=floor(16,0,24,8,"#3b4252"); H+=floor(8.6,9.2,15.4,15.4,"#2e3445"); // toplantı halısı, lounge halısı
H+=`<text transform="${onY(9.6,14.2,0)} rotate(0)" font-size="0" />`;
// ---------- arka duvarlar ----------
H+=box(0,-.3,0,24,.3,3.3,"#2b3550","#1c2438","#1c2438");     // y=0 duvarı (ön yüzü görünür)
H+=box(-.3,0,0,.3,16,3.3,"#2b3550","#18203a","#222b44");      // x=0 duvarı
// CEO odası ahşap kaplama
H+=poly([P(8,0,0),P(16,0,0),P(16,0,3.3),P(8,0,3.3)],"#4b3426");
for(let i=8.5;i<16;i+=.5) H+=`<line x1="${P(i,0,0)[0]}" y1="${P(i,0,0)[1]}" x2="${P(i,0,3.3)[0]}" y2="${P(i,0,3.3)[1]}" stroke="#3e2a1f" stroke-width="1"/>`;
// pencereler (gece şehir)
function winY(x0,x1){ let g=poly([P(x0,0,.9),P(x1,0,.9),P(x1,0,2.9),P(x0,0,2.9)],"url(#night)");
 for(let x=x0+.3;x<x1-.3;x+=.55){const hgt=.6+((x*7.3)%1)*1.1; g+=poly([P(x,0,.9),P(x+.4,0,.9),P(x+.4,0,.9+hgt),P(x,0,.9+hgt)],"#24406f");
  for(let z=1.05;z<.85+hgt;z+=.22) if(((x*13+z*7)%1)>.45) g+=poly([P(x+.1,0,z),P(x+.18,0,z),P(x+.18,0,z+.09),P(x+.1,0,z+.09)],"#ffd98a",`class="fk" style="animation-delay:${-(x*z)%5}s"`)}
 for(let x=x0;x<=x1+.01;x+=(x1-x0)/3) g+=`<line x1="${P(x,0,.9)[0]}" y1="${P(x,0,.9)[1]}" x2="${P(x,0,2.9)[0]}" y2="${P(x,0,2.9)[1]}" stroke="#56627c" stroke-width="2.5"/>`;
 return g+`<polyline points="${pts([P(x0,0,.9),P(x1,0,.9),P(x1,0,2.9),P(x0,0,2.9),P(x0,0,.9)])}" fill="none" stroke="#56627c" stroke-width="3"/>` }
function winX(y0,y1){ let g=poly([P(0,y0,.9),P(0,y1,.9),P(0,y1,2.9),P(0,y0,2.9)],"url(#night)");
 for(let y=y0+.3;y<y1-.3;y+=.6){const hgt=.5+((y*5.7)%1)*1.2; g+=poly([P(0,y,.9),P(0,y+.45,.9),P(0,y+.45,.9+hgt),P(0,y,.9+hgt)],"#203a66");
  for(let z=1.05;z<.85+hgt;z+=.22) if(((y*11+z*5)%1)>.5) g+=poly([P(0,y+.12,z),P(0,y+.2,z),P(0,y+.2,z+.09),P(0,y+.12,z+.09)],"#ffd98a")}
 return g+`<polyline points="${pts([P(0,y0,.9),P(0,y1,.9),P(0,y1,2.9),P(0,y0,2.9),P(0,y0,.9)])}" fill="none" stroke="#56627c" stroke-width="3"/>` }
H+=winY(1,7.4)+winY(16.6,17.6)+winX(1,7)+winX(9,15);
// tabelalar
const sign=(x,y,z,t,onx)=>`<g transform="${onx?onX(x,y,z):onY(x,y,z)}"><rect x="0" y="-15" width="${t.length*8.2+22}" height="22" rx="4" fill="#0e1729" opacity=".85"/><text x="11" y="1" font-size="13" font-weight="600" fill="#e8f0ff">${t}</text></g>`;
H+=sign(1.2,.01,3.25,t("Mail & Araştırma","Mail & Research"))+sign(9,.01,3.25,t("CEO Ofisi","CEO Office"))+sign(17,.01,3.25,t("Toplantı Odası","Meeting Room"));
// CEO odası duvar yazısı
H+=`<g transform="${onY(12.3,.02,2.7)}"><rect width="88" height="40" rx="3" fill="#1e2433"/><text x="8" y="17" font-size="10.5" fill="#e6dccf">${t("Daha büyük işler,","Bigger things,")}</text><text x="8" y="31" font-size="10.5" fill="#e6dccf">${t("birlikte.","together.")}</text></g>`;
// toplantı ekranı (grafik)
H+=`<g transform="${onY(18.6,.02,2.75)}"><rect width="120" height="64" rx="4" fill="#0b1630" stroke="#3a6cf0" stroke-width="2"/>
<text x="8" y="14" font-size="9" fill="#9cc0ff">${t("Haftalık işler","Weekly work")}</text>
${[0,1,2,3,4,5].map(i=>`<rect class="bar" style="animation-delay:${-i*.37}s" x="${12+i*17}" y="22" width="10" height="34" fill="${i%2?"#1ca078":"#4f8cff"}"/>`).join("")}</g>`;
H+=poly([P(18.4,.02,2.85),P(22.8,.02,2.85),P(22.8,1.6,0),P(18.4,1.6,0)],"url(#cool)",'opacity=".18" class="gl"');

// ---------- yardımcı objeler ----------
const plant=(x,y,k=1)=>{const [a,b]=P(x,y);return `<g transform="translate(${a},${b}) scale(${k})"><path d="M-9 0 L9 0 L7 -16 L-7 -16Z" fill="#c9cdd6"/><path d="M-9 0 L9 0 L7 -16 L-7 -16Z" fill="#000" opacity=".15"/><g class="sw" style="animation-delay:${-(x+y)%4}s">${[[-14,-40,-30],[12,-42,28],[0,-50,0],[-8,-34,-55],[9,-34,55],[2,-44,-12]].map(([lx,ly,r],i)=>`<ellipse cx="${lx*.6}" cy="${ly*.6-14}" rx="5.5" ry="15" fill="${i%2?"#2f8f4e":"#3fae60"}" transform="rotate(${r} ${lx*.6} ${ly*.6-14})"/>`).join("")}</g></g>`};
const lamp=(x,y)=>{const [a,b]=P(x,y);return `<ellipse cx="${a}" cy="${b-4}" rx="70" ry="38" fill="url(#warm)" class="gl"/><g transform="translate(${a},${b})"><rect x="-1.5" y="-56" width="3" height="56" fill="#2a2a2a"/><ellipse cx="0" cy="0" rx="8" ry="3" fill="#222"/><path d="M-11 -54 L11 -54 L7 -68 L-7 -68Z" fill="#f3e3c3"/><ellipse cx="0" cy="-58" rx="16" ry="12" fill="#ffd27a" opacity=".35" filter="url(#blur)" class="fk"/></g>`};
const shelf=(x,y,w)=>{let g=cbox(x,y,0,w,.45,2.1,"#3a2a20"); for(let r=0;r<3;r++) for(let i=0;i<w*4;i++){const bx=x+.12+i*.24; g+=poly([P(bx,y+.46,.25+r*.65),P(bx+.17,y+.46,.25+r*.65),P(bx+.17,y+.46,.68+r*.65),P(bx,y+.46,.68+r*.65)],["#b8473a","#3a6cf0","#d9a441","#2f8f6e","#7c5cd6","#cfc6b3"][(i+r*2)%6])} return g};
