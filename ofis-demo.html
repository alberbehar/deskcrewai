<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskCrew AI — Panel</title>
<style>
html,body{margin:0;height:100%;background:#0a0710;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#f1e9e1}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.log{position:absolute;left:14px;bottom:12px;width:min(46%,380px);font:12px/1.65 "JetBrains Mono",ui-monospace,Consolas,monospace;color:#cbbfb3;pointer-events:none}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:in .4s ease}
.log b{font-weight:700}
.log .d{color:#fb923c}.log .e{color:#a78bfa}.log .s{color:#38bdf8}
.log span{color:#7a6e66;margin-right:6px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.hint{position:absolute;right:14px;top:12px;font:11.5px "JetBrains Mono",ui-monospace,monospace;color:#b9a99a;border:1px solid #3a2616;border-radius:99px;padding:4px 11px;background:rgba(20,12,8,.7)}
.card{position:absolute;right:14px;top:46px;width:min(260px,44%);background:rgba(18,11,8,.92);border:1px solid #4a2c16;border-radius:14px;padding:14px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .3s,transform .3s}
.card[hidden]{display:block;opacity:0;transform:translateY(8px);pointer-events:none}
.card h4{margin:0 0 2px;font-size:16px}
.card small{color:#b9a99a}
.card p{margin:10px 0 0;font-size:13px;color:#e8dccf}
.card .k{font:600 10.5px "JetBrains Mono",monospace;color:#fb923c;letter-spacing:.06em;text-transform:uppercase;margin-top:12px}
.card button{margin-top:12px;background:none;border:1px solid #5a3519;color:#fdba74;border-radius:9px;padding:6px 10px;font:600 12px inherit;cursor:pointer}
@media (max-width:560px){.log{width:calc(100% - 28px);font-size:11px}.card{width:calc(100% - 28px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint"></div>
<div class="card" id="card" hidden></div>
<div class="log" id="log"></div>
<script>
const Q = new URLSearchParams(location.search), EN = Q.get("lang") === "en";
const t = s => { const [a, b] = s.split("|"); return EN ? b : a };
document.documentElement.lang = EN ? "en" : "tr";
document.getElementById("hint").textContent = t("gezegene tıkla: içine gir|click a planet to step inside");

const TEAM = [
  { id: "mudur", name: t("Müdür|Manager"), role: t("Ekibin yöneticisi|Runs the team"), col: "#fb923c" },
  { id: "posta", name: t("Posta|Mail"), role: t("E-posta asistanı|Email assistant"), col: "#d9485f" },
  { id: "gezgin", name: t("Gezgin|Scout"), role: t("Araştırmacı|Researcher"), col: "#2f6fe0" },
  { id: "dosya", name: t("Dosyacı|Files"), role: t("Dosya düzenleyici|File organizer"), col: "#d98a1c" },
  { id: "saat", name: t("Saat|Clock"), role: t("Zamanlanmış işler|Scheduled tasks"), col: "#1f9b74" },
  { id: "finans", name: t("Finans|Finance"), role: t("Fatura ve ödemeler|Bills and payments"), col: "#8b5cf6" }
];
const byId = Object.fromEntries(TEAM.map(e => [e.id, e]));
const STATE = Object.fromEntries(TEAM.map(e => [e.id, { st: "idle", now: t("Boşta, iş bekliyor.|Idle, waiting for work.") }]));
const LINKS = {}, MSGS = [];

// Senaryo: Müdür işi dağıtır, çalışanlar birbirine danışır (döngü halinde tekrarlar)
const SCRIPT = [
  ["d", "mudur", "posta", t("Son 24 saatin önemli maillerini özetle|Summarize today's important emails")],
  ["w", "posta", t("Mailleri okuyor…|Reading emails…")],
  ["d", "mudur", "gezgin", t("Bugünkü dolar kurunu bul|Find today's USD rate")],
  ["w", "gezgin", t("İnternette arıyor…|Searching the web…")],
  ["e", "posta", "finans", t("Bu faturayı ödendi olarak işaretler misin?|Can you mark this bill as paid?")],
  ["w", "finans", t("Faturaları kontrol ediyor…|Checking bills…")],
  ["r", "gezgin", "mudur", t("Dolar 41,82 TL|USD = 41.82 TRY")],
  ["e", "finans", "gezgin", t("120 doları TL'ye çevirir misin?|Convert $120 to TRY?")],
  ["r", "gezgin", "finans", "120 $ ≈ 5.018 TL"],
  ["r", "posta", "mudur", t("3 önemli mail var, özet hazır|3 important emails, summary ready")],
  ["d", "mudur", "dosya", t("İndirilenler klasörünü düzenle|Tidy the Downloads folder")],
  ["w", "dosya", t("34 dosyayı sıralıyor…|Sorting 34 files…")],
  ["d", "mudur", "saat", t("Her sabah 9'da rapor gönder|Send a report every day at 9")],
  ["r", "dosya", "mudur", t("Bitti, hiçbir şey silinmedi|Done, nothing deleted")],
  ["r", "saat", "mudur", t("Görev kuruldu · yarın 09:00|Task set · tomorrow 09:00")]
];
let step = 0;
const logEl = document.getElementById("log");
function log(kind, text) {
  const d = new Date(), hh = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0");
  const el = document.createElement("div");
  const lab = kind === "d" ? t("MÜDÜR|MANAGER") : kind === "e" ? t("EKİP|TEAM") : t("SİSTEM|SYSTEM");
  el.innerHTML = `<span>${hh}</span><b class="${kind === "d" ? "d" : kind === "e" ? "e" : "s"}">${lab}</b> `;
  el.appendChild(document.createTextNode(text));
  logEl.prepend(el);
  while (logEl.children.length > 5) logEl.lastChild.remove();
}
function link(a, b) { const k = [a, b].sort().join("|"); LINKS[k] = (LINKS[k] || 0) + 1 }
function tick() {
  const s = SCRIPT[step % SCRIPT.length]; step++;
  if (step % SCRIPT.length === 1 && step > 1) { for (const k in LINKS) LINKS[k] = Math.max(0, LINKS[k] - 1) }
  const [k, a, b, txt] = s;
  if (k === "w") { STATE[a] = { st: "busy", now: b }; log("s", `${byId[a].name} · ${b}`) }
  else {
    MSGS.push({ from: a, to: b, t: performance.now() }); link(a, b);
    if (k === "r") { STATE[a] = { st: "idle", now: t("Boşta, iş bekliyor.|Idle, waiting for work."), last: txt } }
    else STATE[b] = { st: "busy", now: txt };
    log(k === "d" ? "d" : k === "e" ? "e" : "s", `${byId[a].name} → ${byId[b].name}: ${txt}`);
  }
  if (ZOOM && ZOOM.dir > 0) card();
}
setInterval(tick, 1700); setTimeout(tick, 300);

// --- çizim ---
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W = 0, H = 0, dpr = 1, stars = [], dust = [];
function size() {
  dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  stars = Array.from({ length: 220 }, () => [rnd() * W, rnd() * H, rnd() * 1.4 + .2, rnd() * 6]);
  dust = Array.from({ length: 360 }, () => [rnd() * 7, .5 + rnd() * .55, rnd() < .5 ? "251,146,60" : "167,139,250", rnd()]);
}
addEventListener("resize", size); size();
function ball(x, y, r, col, glow) {
  if (glow) { const gg = g.createRadialGradient(x, y, r, x, y, r * 3.2); gg.addColorStop(0, glow); gg.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gg; g.beginPath(); g.arc(x, y, r * 3.2, 0, 7); g.fill() }
  const gr = g.createRadialGradient(x - r * .4, y - r * .4, r * .1, x, y, r); gr.addColorStop(0, "#fff"); gr.addColorStop(.25, col); gr.addColorStop(1, "#0b0a12");
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}
const POS = {}; let hits = [], ZOOM = null, VIEW = { s: 1, ox: 0, oy: 0 }, SEL = null;
function frame(now) {
  requestAnimationFrame(frame);
  const T = now / 1000, small = W < 560, cx = W * (small ? .5 : .58), cy = H * (small ? .4 : .46);
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  for (const s of stars) { g.fillStyle = `rgba(255,230,210,${.2 + .35 * Math.sin(T * 1.3 + s[3]) ** 2})`; g.fillRect(s[0], s[1], s[2], s[2]) }
  if (ZOOM) { ZOOM.k = Math.max(0, Math.min(1, ZOOM.k + ZOOM.dir * .06)); if (ZOOM.k === 0 && ZOOM.dir < 0) ZOOM = null }
  const zk = ZOOM ? ZOOM.k * ZOOM.k * (3 - 2 * ZOOM.k) : 0, F = ZOOM && POS[ZOOM.id] ? POS[ZOOM.id] : [cx, cy];
  const zs = 1 + 2 * zk, Lx = F[0] + (W * (small ? .5 : .32) - F[0]) * zk, Ly = F[1] + (H * (small ? .3 : .5) - F[1]) * zk;
  VIEW = { s: zs, ox: Lx - F[0] * zs, oy: Ly - F[1] * zs };
  g.setTransform(dpr * zs, 0, 0, dpr * zs, dpr * VIEW.ox, dpr * VIEW.oy);
  const R = Math.min(W * (small ? .46 : .38), H * .9), ry = .34;
  for (const d of dust) { const a = d[0] + T * .03 * (1.4 - d[1]), rr = R * d[1]; g.fillStyle = `rgba(${d[2]},${.2 + .3 * d[3]})`; g.fillRect(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * ry, 1.3, 1.3) }
  hits = [];
  const lead = TEAM[0], ring = TEAM.slice(1);
  const sunR = (small ? 20 : 26) + Math.sin(T * 2) * 1.2;
  ball(cx, cy, sunR, lead.col, "rgba(251,146,60,.45)");
  g.strokeStyle = "rgba(251,191,36,.5)"; g.lineWidth = 1; g.beginPath(); g.ellipse(cx, cy, sunR + 9, (sunR + 9) * .35, -.25, 0, 7); g.stroke();
  POS[lead.id] = [cx, cy]; hits.push({ id: lead.id, x: cx, y: cy, r: sunR });
  g.textAlign = "center";
  g.font = "700 11px 'JetBrains Mono',ui-monospace,monospace"; g.fillStyle = "#fdba74"; g.fillText(lead.name.toLocaleUpperCase(EN ? "en" : "tr"), cx, cy + sunR + 18);
  ring.forEach((e, i) => {
    const k = (i + 1) / (ring.length + 1), rx = R * (.42 + .58 * k), a = i * 2.39996 + T * (.16 / (.5 + k));
    g.strokeStyle = "rgba(148,163,184,.10)"; g.lineWidth = 1; g.beginPath(); g.ellipse(cx, cy, rx, rx * ry, 0, 0, 7); g.stroke();
    const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * rx * ry, busy = STATE[e.id].st === "busy", rad = (small ? 8 : 10) + (i % 3) * 2;
    ball(x, y, rad, e.col, busy ? `rgba(245,158,11,${.35 + .25 * Math.sin(T * 5)})` : null);
    if (i % 3 === 1) { g.strokeStyle = "rgba(255,255,255,.35)"; g.beginPath(); g.ellipse(x, y, rad + 6, (rad + 6) * .3, -.4, 0, 7); g.stroke() }
    if (e.id === SEL) { g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, rad + 5, 0, 7); g.stroke() }
    g.font = "700 11px 'JetBrains Mono',ui-monospace,monospace"; g.fillStyle = e.col; g.fillText(e.name.toLocaleUpperCase(EN ? "en" : "tr"), x, y - rad - 8);
    g.font = "500 10px 'JetBrains Mono',ui-monospace,monospace"; g.fillStyle = busy ? "#fbbf24" : "#94a3b8";
    g.fillText(busy ? t("görevde|on task") : t("boşta|idle"), x, y + rad + 13);
    POS[e.id] = [x, y]; hits.push({ id: e.id, x, y, r: rad });
  });
  for (const key in LINKS) { const n = LINKS[key]; if (!n) continue; const [a, b] = key.split("|"), A = POS[a], B = POS[b];
    g.strokeStyle = `rgba(253,186,116,${Math.min(.45, .1 + n * .07)})`; g.lineWidth = Math.min(3, .8 + n * .35) / zs; g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke() }
  for (const m of MSGS) { const age = (now - m.t) / 1000, A = POS[m.from], B = POS[m.to]; if (age > 6) continue;
    const f = Math.min(1, age / 1.4);
    g.strokeStyle = `rgba(253,186,116,${.5 * (1 - age / 6)})`; g.lineWidth = 1.2 / zs; g.setLineDash([4, 5]); g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke(); g.setLineDash([]);
    const x = A[0] + (B[0] - A[0]) * f, y = A[1] + (B[1] - A[1]) * f, gg = g.createRadialGradient(x, y, 0, x, y, 9);
    gg.addColorStop(0, "rgba(255,237,213,1)"); gg.addColorStop(1, "rgba(251,146,60,0)"); g.fillStyle = gg; g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill() }
  while (MSGS.length && now - MSGS[0].t > 7000) MSGS.shift();
}
requestAnimationFrame(frame);

// --- tıklayınca içine gir ---
const cardEl = document.getElementById("card");
function card() {
  if (!ZOOM) { cardEl.hidden = true; return }
  const e = byId[ZOOM.id], s = STATE[e.id];
  const peers = Object.entries(LINKS).filter(([k, n]) => n && k.split("|").includes(e.id)).map(([k, n]) => byId[k.split("|").find(x => x !== e.id)].name + " · " + n);
  cardEl.innerHTML = `<h4 style="color:${e.col}">${e.name}</h4><small>${e.role}</small>
    <div class="k">${t("Şu an|Right now")}</div><p></p>
    <div class="k">🔗 ${t("Bağlantıları|Connections")}</div><p>${peers.length ? peers.join("  ") : t("Henüz yok|None yet")}</p>
    <button type="button">← ${t("Haritaya dön|Back to map")}</button>`;
  cardEl.querySelector("p").textContent = s.now + (s.last ? "  ·  " + t("Son|Last") + ": " + s.last : "");
  cardEl.querySelector("button").onclick = out;
  cardEl.hidden = false;
}
function out() { if (ZOOM) ZOOM.dir = -1; SEL = null; cardEl.hidden = true }
function hitAt(ev) { const x = (ev.clientX - VIEW.ox) / VIEW.s, y = (ev.clientY - VIEW.oy) / VIEW.s; return hits.find(p => Math.hypot(p.x - x, p.y - y) < p.r + 12 / VIEW.s) }
cv.addEventListener("click", ev => { const h = hitAt(ev); if (h) { ZOOM = { id: h.id, k: ZOOM && ZOOM.id === h.id ? ZOOM.k : 0, dir: 1 }; SEL = h.id; card() } else if (ZOOM) out() });
cv.addEventListener("mousemove", ev => { cv.style.cursor = hitAt(ev) ? "pointer" : "default" });
</script>
</body>
</html>
