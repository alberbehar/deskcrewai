<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeskCrew AI 3D ofis</title>
<style>
:root{--bg:#0b1220;--panel:#111b2e;--ink:#e7edf7;--muted:#8a98b0;--line:#1f2b42;--acc:#2f6fe0;--ok:#22c55e;--body:"Segoe UI",Inter,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);overflow:hidden}
.app{display:grid;grid-template-columns:78px minmax(0,1fr) 320px;grid-template-rows:56px minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(#0e1729,#0b1322)}
.lg{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}.lg i{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,#3a6cf0,#1ca078,#5ad1ff,#3a6cf0);position:relative;box-shadow:0 0 14px #3a6cf088}
.lg i:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#0e1729}.lg span{font-weight:400;color:#7fb0ff}
.sub{color:#7f93b5;font-size:13px}.sp{flex:1}
.pill{border:1px solid #2a3a58;border-radius:10px;padding:6px 12px;font-size:12.5px;display:flex;align-items:center;gap:7px;background:#0f1a2e}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok)}
.nav{background:#0c1424;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding-top:10px;align-items:center}
.nav div{width:66px;text-align:center;color:#8fa0bd;font-size:11.5px;padding:9px 0;border-radius:10px}.nav div b{display:block;font-size:18px;font-weight:400}
.nav .on{background:#14223b;color:#fff;box-shadow:inset 3px 0 0 #4f8cff}
#stage{position:relative;min-width:0;min-height:0}
.chat{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chat header{padding:14px 16px;border-bottom:1px solid var(--line)}.chat header b{font-size:15px}.chat header small{display:block;color:var(--muted)}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;overflow:hidden}
.m{max-width:88%;padding:8px 12px;border-radius:14px;font-size:13px;animation:in .35s ease-out}
.m.me{align-self:flex-end;background:var(--acc)}.m.ai{background:#1a2740}.m.ai em{display:block;font-style:normal;color:#7fb0ff;font-size:11.5px;font-weight:700;margin-bottom:2px}
.m.st{align-self:center;background:none;color:var(--muted);font-size:12px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.inp{margin:10px;background:#0b1322;border:1px solid #2a3a58;border-radius:12px;padding:11px;color:var(--muted)}
/* video yazıları */
.cap{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);background:rgba(9,15,28,.86);border:1px solid #2a3a58;color:#fff;border-radius:16px;padding:12px 26px;font-size:clamp(18px,2.6vw,30px);font-weight:700;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.45);transition:opacity .4s;opacity:0;z-index:20}
.card{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 45%,rgba(20,36,70,.82),rgba(7,12,24,.95));z-index:30;opacity:0;transition:opacity .5s;pointer-events:none}
.card h1{margin:0;font-size:clamp(40px,7vw,86px);letter-spacing:-.02em}.card h1 span{color:#7fb0ff}.card p{margin:10px 0 0;font-size:clamp(18px,2.4vw,30px);color:#c8d3e6}
.card .dl{display:inline-block;margin-top:26px;background:#2f6fe0;color:#fff;border-radius:14px;padding:14px 28px;font-size:clamp(16px,2vw,24px);font-weight:700}
.card .ring{width:clamp(70px,9vw,110px);height:clamp(70px,9vw,110px);border-radius:50%;margin:0 auto 22px;background:conic-gradient(from 200deg,#3a6cf0,#1ca078,#5ad1ff,#3a6cf0);position:relative;box-shadow:0 0 40px #3a6cf088}
.card .ring:after{content:"";position:absolute;inset:24%;border-radius:50%;background:#0b1220}
body.video .cap,body.video .card,body.video .o3-bub{transition:none!important}body.video .m{animation:none}body.video .o3-hint,body.video .o3-tools{display:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
@media (max-width:980px){.app{grid-template-columns:0 minmax(0,1fr) 0}.nav,.chat{display:none}.sub{display:none}}
</style>
</head><body>
<div class="app">
 <div class="top"><div class="lg"><i></i>DeskCrew AI <span>Office</span></div><span class="sub" id="tSub"></span><span class="sp"></span><span class="pill"><i></i><span id="tAct"></span></span></div>
 <div class="nav"><div class="on"><b>🏢</b><span data-t="Ofis|Office"></span></div><div><b>💬</b><span data-t="Sohbet|Chat"></span></div><div><b>☑️</b><span data-t="Görevler|Tasks"></span></div><div><b>📊</b><span data-t="Etkinlik|Activity"></span></div><div><b>⚙️</b><span data-t="Ayarlar|Settings"></span></div></div>
 <div id="stage"></div>
 <div class="chat"><header><b data-t="Ekip|Team"></b><small data-t="Herkes sırayla cevap verir|Everyone answers in turn"></small></header><div class="msgs" id="msgs"></div><div class="inp" data-t="Ekibe bir iş ver…|Give the team a task…"></div></div>
</div>
<div class="cap" id="cap"></div>
<div class="card" id="cardA"><div><div class="ring"></div><h1>DeskCrew <span>AI</span></h1><p data-t="Masaüstündeki yapay zeka ekibin|Your AI team on your desktop"></p></div></div>
<div class="card" id="cardB"><div><div class="ring"></div><h1>DeskCrew <span>AI</span></h1><p data-t="Sen söyle, ekibin halletsin.|You say it, your team does it."></p><span class="dl" data-t="Windows için ücretsiz · deskcrewai.com|Free for Windows · deskcrewai.com"></span></div></div>
<script src="office3d.js"></script>
<script>
const Q = new URLSearchParams(location.search), EN = Q.get("lang") === "en", VIDEO = Q.get("video") === "1";
const t = s => { const [a, b] = s.split("|"); return EN ? b : a };
document.documentElement.lang = EN ? "en" : "tr";
document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
document.getElementById("tSub").textContent = t("› Sen söyle, ekibin halletsin.|› You say it, your team does it.");

// ---- ekip (programdaki hazır ekip) ----
const LOOKS = { mudur: { skin: "#efc3a0", hair: "#8a8f99", hs: "side", beard: 1, tie: 1, collar: "#f2f4f8", c: "#283043" }, posta: { skin: "#f2c9a8", hair: "#6b3a1e", hs: "long" },
  gezgin: { skin: "#c98e65", hair: "#1d1d1d", hs: "curly", glasses: 1 }, dosyaci: { skin: "#f3d2b8", hair: "#d8b25a", hs: "bun" }, saat: { skin: "#a86f4c", hair: "#2b1b12", hs: "short", glasses: 1 },
  operator: { skin: "#f0c09b", hair: "#4a2f20", hs: "short", headset: 1 }, yazilimci: { skin: "#e8b48f", hair: "#1d1d1d", hs: "curly", glasses: 1 }, asistan: { skin: "#f3d2b8", hair: "#3b2416", hs: "long", headset: 1 } };
const TEAM = [["mudur", "Müdür|Manager", "#18202b", "team", "⭐"], ["posta", "Posta|Mail", "#d9485f", "mail", "✉️"], ["gezgin", "Gezgin|Scout", "#2f6fe0", "web", "🔎"], ["dosyaci", "Dosyacı|Files", "#d98a1c", "files", "📁"],
  ["saat", "Saat|Time", "#1f9b74", "tasks", "⏰"], ["operator", "Operatör|Operator", "#8b5cf6", "computer", "🖱️"], ["yazilimci", "Yazılımcı|Developer", "#0ea5a4", "code", "💻"], ["asistan", "Asistan|Assistant", "#db2777", "phone", "📞"]];
const N = {}, people = {};
TEAM.forEach(([id, n, c, kind, icon], i) => { N[id] = t(n); people[id] = { i, id, n: N[id], c, icon, kind, ...LOOKS[id] } });
const rooms = [{ id: "r1", type: "work", key: "mail" }, { id: "r2", type: "work", key: "files" }, { id: "r3", type: "ceo", key: "ceo" }, { id: "r4", type: "lounge", key: "lounge" }, { id: "r5", type: "meeting", key: "meeting" }, { id: "r6", type: "work", key: "ops", desks: 3 }];
const seats = { posta: "r1", gezgin: "r1", dosyaci: "r2", saat: "r2", mudur: "r3", operator: "r6", yazilimci: "r6", asistan: "r6" };
const names = { r1: t("Mail & Araştırma|Mail & Research"), r2: t("Dosya & Planlama|Files & Planning"), r3: t("CEO Ofisi|CEO Office"), r4: t("Dinlenme Alanı|Lounge"), r5: t("Toplantı Odası|Meeting Room"), r6: t("Operasyon|Operations") };
const ST = [ "", t("Çalışıyor|Working"), t("Takipte|Following"), t("Boşta|Idle") ];
const stage = document.getElementById("stage"), msgs = document.getElementById("msgs");
let O = window.OFFICE3D;
if (!O || !O.supported()) { stage.innerHTML = `<div class="fallback">${t("Bu tarayıcı 3D görüntüyü desteklemiyor.|This browser can't show 3D.")}</div>`; O = null }
else {
  O.mount(stage, { zoom: false, controls: !matchMedia("(pointer:coarse)").matches, onSelect: id => O.select(id) });
  O.build({ rooms, seats, people, names, texts: { st: ST, inMeeting: t("Toplantıda|In a meeting"), hire: "", reset: t("⟲ Görünümü sıfırla|⟲ Reset view"), hint: t("Sürükleyerek döndür|Drag to rotate") } });
  ["saat", "dosyaci"].forEach(id => O.status(id, 2));
}
let meet = null;
const state = {}; Object.keys(people).forEach(id => state[id] = 3); state.saat = state.dosyaci = 2;
function setSt(id, k) { state[id] = k; if (O) O.status(id, k, meet && meet.includes(id)); const n = Object.values(state).filter(x => x < 3).length; document.getElementById("tAct").textContent = `${n}/8 ${t("aktif|active")}` }
setSt("saat", 2);
function msg(kind, text, who) { const d = document.createElement("div"); d.className = "m " + kind; if (who) { const e = document.createElement("em"); e.textContent = N[who]; d.appendChild(e) } d.appendChild(document.createTextNode(text)); msgs.appendChild(d); while (msgs.children.length > 7) msgs.firstChild.remove() }
const say = (id, s, ms = 4200) => O && O.bubble(id, t(s), ms);
// ---- senaryo: [zaman (sn), iş] ----
const S = [
 [0.5, () => msg("me", t("Kadıköy'deki diş kliniklerini bul, yarın için randevu al|Find dental clinics near me and book one for tomorrow"))],
 [1.6, () => { setSt("mudur", 1); say("mudur", "Gezgin, bu iş sende!|Scout, this one's yours!", 2600) }],
 [3.0, () => { setSt("mudur", 3); setSt("gezgin", 1); say("gezgin", "İnternette arıyor…|Searching the web…", 3000) }],
 [6.0, () => { setSt("gezgin", 3); say("gezgin", "3 klinik buldum 👍|Found 3 clinics 👍", 2600); msg("ai", t("3 klinik buldum, en yakını Kadıköy Dent.|Found 3 clinics; the closest is Bay Dental."), "gezgin") }],
 [7.5, () => { setSt("asistan", 1); say("asistan", "Telefonla arıyor…|On a phone call…", 3300); msg("st", t("📞 Telefonla arama… (Kadıköy Dent)|📞 Phone call… (Bay Dental)")) }],
 [11.0, () => { setSt("asistan", 3); say("asistan", "Yarın 14:30'a randevu alındı ✅|Booked for tomorrow 2:30 PM ✅", 3000); msg("ai", t("Yarın 14:30'a randevu alındı, takvime ekledim ✅|Booked for tomorrow at 2:30 PM and added to your calendar ✅"), "asistan") }],
 [12.8, () => msg("me", t("CV'mi Word'de hazırla, ik@firma.com'a gönder|Make my CV in Word and send it to hr@company.com"))],
 [13.8, () => { setSt("posta", 1); say("posta", "Mail yazıp gönderiyor…|Writing & sending an email…", 3000) }],
 [16.6, () => { setSt("posta", 3); say("posta", "CV gönderildi ✉️|CV sent ✉️", 2500); msg("ai", t("CV.docx hazır ve ik@firma.com'a gönderildi.|CV.docx is ready and sent to hr@company.com."), "posta") }],
 [17.6, () => { setSt("yazilimci", 1); say("yazilimci", "Kod yazıyor…|Writing code…", 3000); msg("me", t("Sitemdeki iletişim formunu düzelt|Fix the contact form on my site")) }],
 [20.4, () => { setSt("yazilimci", 3); say("yazilimci", "Düzelttim, testler geçti ✅|Fixed, tests passing ✅", 2600); msg("ai", t("Form düzeldi, testler geçti ✅|The form is fixed and tests pass ✅"), "yazilimci") }],
 [21.6, () => { meet = ["mudur", "posta", "gezgin", "dosyaci", "saat", "operator", "yazilimci", "asistan"]; if (O) O.meeting(meet); meet.forEach(id => setSt(id, state[id])); msg("st", t("📅 Toplantı: haftalık plan|📅 Meeting: weekly plan")) }],
 [22.6, () => say("mudur", "Bu haftanın önceliği yeni müşteriler.|This week's priority: new customers.", 2600)],
 [24.0, () => say("gezgin", "Rakip fiyatlarını çıkardım.|I've pulled competitor prices.", 2400)],
 [25.4, () => say("posta", "3 teklif maili cevap bekliyor.|3 offer emails need replies.", 2400)],
 [27.0, () => { const m = meet; meet = null; if (O) O.meeting(null); m.forEach(id => setSt(id, state[id])); say("mudur", "Özeti mailine gönderdim.|I've emailed you the summary.", 2600); msg("ai", t("Toplantı özeti ve yapılacaklar listesi mailinde.|Meeting summary and to-do list are in your inbox."), "mudur") }],
];
const LOOP = 31;
if (!VIDEO) {   // sitede canlı: senaryo döngüde oynar
  let k = 0, base = performance.now() / 1000;
  setInterval(() => { const now = performance.now() / 1000 - base; while (k < S.length && S[k][0] <= now) S[k++][1](); if (now > LOOP) { k = 0; base = performance.now() / 1000; msgs.innerHTML = "" } }, 100);
} else {        // tanıtım videosu: renderAt(saniye) ile kare kare çizilir
  document.body.classList.add("video");
  const CAP = [[3.3, 5.0, "Sen söyle, ekibin halletsin.|You say it, your team does it."], [5.1, 8.8, "İnternette araştırır.|It researches the web."], [9.4, 14.4, "Senin adına arar, randevu alır.|It calls and books for you."],
    [14.6, 19.2, "Mailini yazar, dosyanı hazırlar.|It writes your email and documents."], [19.4, 23.2, "Kod yazar, test eder.|It writes and tests code."], [23.6, 29.0, "Toplantı yapar, Müdür özetler.|It holds meetings; the Manager sums up."],
    [29.8, 33.0, "Canlı 3D ofis: kim ne yapıyor, gör.|A live 3D office: see who's doing what."]];
  const cap = document.getElementById("cap"), A = document.getElementById("cardA"), B = document.getElementById("cardB");
  let k = 0, home = null, P0 = {};
  const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
  window.renderAt = (sec, draw) => {
    if (!O) return; O._manual(); O._clock(() => sec * 1000 + 100000);
    if (!home) { home = O.fitView(); Object.keys(people).forEach(id => P0[id] = O.charPos(id)) }
    while (k < S.length && S[k][0] + 2 <= sec) S[k++][1]();   // senaryo 2 sn kaydırılır (önce başlık)
    // kamera: genel → kişi → genel
    const at = id => { const p = P0[id]; return { target: [p[0], 1.0, p[2]], dist: home.dist * 0.42 } };
    const mr = { target: [2 * 6.4 + 3.2, 0.9, 2.8], dist: home.dist * 0.5 };
    const K = [[0, home], [4.4, home], [5.6, at("gezgin")], [8.4, at("gezgin")], [9.6, at("asistan")], [13.8, at("asistan")], [15.2, at("posta")], [18.8, at("posta")], [19.9, at("yazilimci")], [22.7, at("yazilimci")], [24.0, mr], [28.8, mr], [30.4, home], [99, home]];
    let i = 0; while (i < K.length - 2 && K[i + 1][0] <= sec) i++;
    const [t0, a] = K[i], [t1, b] = K[i + 1], f = ease((sec - t0) / Math.max(0.01, t1 - t0)), L = (x, y) => x + (y - x) * f;
    O.view([L(a.target[0], b.target[0]), L(a.target[1], b.target[1]), L(a.target[2], b.target[2])], L(a.dist, b.dist), 0.78 + Math.sin(sec * 0.15) * 0.06, 0.66);
    const c = CAP.find(([s, e]) => sec >= s && sec < e); if (c) cap.textContent = t(c[2]); cap.style.opacity = c ? Math.min(1, (sec - c[0]) / 0.3, (c[1] - sec) / 0.3) : 0;
    A.style.opacity = 1 - ease((sec - 2.6) / 0.6); B.style.opacity = ease((sec - 33.0) / 0.6);
    if (draw !== false) O._renderAt(sec * 1000 + 100000) };
  window.__ready = true;
}
</script>
</body></html>
