<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeskCrew AI — Ofis</title>
<style>
  :root{--bg:#0a0710;--panel:#161d27;--ink:#e9eef4;--muted:#9aa6b4;--line:#263140;--brand:#2f6fe0;--brand2:#1ca078}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  canvas{image-rendering:pixelated;display:block;cursor:default}
  #tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;display:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #tip b{display:block;font-size:13px}
  #tip span{color:var(--muted)}
  #demo{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #demo .t{font-weight:700;margin-right:6px}
  #demo button{border:1px solid var(--line);background:#1c2531;color:var(--ink);border-radius:8px;padding:6px 11px;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer}
  #demo button:hover{border-color:var(--brand)}
  #demo button.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent}
  #demo .sp{flex:1}
  #demo small{color:var(--muted)}
  #credits{position:absolute;left:12px;bottom:8px;font-size:11px;color:var(--muted);opacity:.7}
  #credits a{color:inherit}
</style>
</head>

// ── Images ───────────────────────────────────────────────────────────
const img = {};
function loadAll() {
  const jobs = [];
  for (const group of ['chars','floors','furn']) for (const [k, src] of Object.entries(ASSETS[group])) {
    const im = new Image(); im.src = src; img[group + ':' + k] = im; jobs.push(im.decode());
  }
  return Promise.all(jobs);
}
const F = k => img['furn:' + k];

// ── Walkability ──────────────────────────────────────────────────────
const blocked = [];
for (let r = 0; r < ROWS; r++) { blocked.push([]); for (let c = 0; c < COLS; c++) blocked[r].push(isWallTile(c, r)); }
const BG_ROWS = {DESK:1, TABLE:1, LARGE_PLANT:2, PLANT:1, PLANT_2:1, CACTUS:1, SOFA_SIDE:1, COFFEE_TABLE:1, SMALL_TABLE:1};
for (const [k, c, r, b] of FURN) {
  if (!b) continue;
  const im = F(k), w = Math.ceil(ASSETS.size[k][0] / T), h = Math.ceil(ASSETS.size[k][1] / T);
  for (let y = r + (BG_ROWS[k] || 0); y < r + h; y++) for (let x = c; x < c + w; x++) if (y < ROWS && x < COLS) blocked[y][x] = true;
}
for (const s of [...DESK_SEATS, MANAGER_SEAT, ...MEETING_SEATS]) blocked[s.row][s.col] = false;

function findPath(sc, sr, tc, tr) {
  if (sc === tc && sr === tr) return [];
  const key = (c, r) => r * COLS + c, prev = new Map([[key(sc, sr), null]]), q = [[sc, sr]];
  while (q.length) {
    const [c, r] = q.shift();
    if (c === tc && r === tr) break;
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nc = c + dc, nr = r + dr, k = key(nc, nr);
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || prev.has(k)) continue;
      if (blocked[nr][nc] && !(nc === tc && nr === tr)) continue;
      prev.set(k, key(c, r)); q.push([nc, nr]);
    }
  }
  if (!prev.has(key(tc, tr))) return null;
  const path = []; let k = key(tc, tr);
  while (k !== key(sc, sr)) { path.unshift([k % COLS, Math.floor(k / COLS)]); k = prev.get(k); }
  return path;
}

// ── Agents ───────────────────────────────────────────────────────────
const LOOKS = ['mudur','posta','gezgin','dosyaci','saat','operator','yazilimci','asistan'];
const EN = new URLSearchParams(location.search).get('lang') === 'en';
const tt = s => { const [a, b] = s.split('|'); return EN ? b : a };
document.documentElement.lang = EN ? 'en' : 'tr';
const STATUS_TEXT = {idle:tt('Boşta|Idle'), working:tt('Çalışıyor|Working'), reading:tt('Okuyor|Reading'), waiting:tt('Onayını bekliyor|Waiting for you'), meeting:tt('Toplantıda|In a meeting'), talking:tt('Danışıyor|Consulting')};
const ROW_OF = {down:0, up:1, right:2, left:2};
const agents = new Map();
let meeting = null;
const rnd = (a, b) => a + Math.random() * (b - a);

function makeAgent(def, i) {
  const seat = def.manager ? MANAGER_SEAT : DESK_SEATS[i % DESK_SEATS.length];
  const a = {
    id: def.id, name: def.name, role: def.role || '', look: LOOKS.includes(def.look) ? def.look : LOOKS[(i + 1) % LOOKS.length],
    manager: !!def.manager, home: seat, seat, status: 'idle', text: '',
    col: seat.col, row: seat.row, x: seat.col * T, y: seat.row * T, dir: seat.dir, path: [],
    sitting: true, anim: 0, frame: 7, wanderAt: performance.now() + rnd(6000, 16000), errand: null,
  };
  return a;
}

function goTo(a, col, row, onArrive) {
  const p = findPath(a.col, a.row, col, row);
  if (p === null) return false;
  a.sitting = false; a.path = p; a.onArrive = onArrive || null;
  if (!p.length) { a.onArrive = null; onArrive && onArrive(); }
  return true;
}
function sitAt(a, seat) {
  a.seat = seat;
  goTo(a, seat.col, seat.row, () => { a.sitting = true; a.dir = seat.dir; });
}
function goHome(a) { a.errand = null; sitAt(a, a.home); }

function setStatus(id, status, text) {
  const a = agents.get(id); if (!a) return;
  a.status = STATUS_TEXT[status] ? status : 'idle';
  a.text = text || '';
  a.bubbleUntil = text ? performance.now() + 6000 : 0;
  if (a.status === 'meeting') return;
  if (meeting && meeting.has(id) && a.status !== 'meeting') return;   // stays in the meeting
  if (a.status !== 'idle' || a.seat !== a.home || !a.sitting) { if (!a.errand || a.status !== 'idle') goHome(a); }
}

function startMeeting(ids) {
  const list = (ids && ids.length ? ids : [...agents.keys()]).filter(id => agents.has(id));
  list.sort((x, y) => agents.get(y).manager - agents.get(x).manager);
  meeting = new Set(list);
  list.forEach((id, i) => {
    const a = agents.get(id), seat = MEETING_SEATS[i % MEETING_SEATS.length];
    a.status = 'meeting'; a.errand = null; a.text = ''; a.bubbleUntil = 0;
    setTimeout(() => sitAt(a, seat), i * 250);
  });
}
function endMeeting() {
  if (!meeting) return;
  for (const id of meeting) { const a = agents.get(id); if (a) { a.status = 'idle'; goHome(a); } }
  meeting = null;
}

function consult(fromId, toId, text) {
  const a = agents.get(fromId), b = agents.get(toId); if (!a || !b || a === b) return;
  const spots = [[b.col, b.row + 1], [b.col - 1, b.row], [b.col + 1, b.row], [b.col, b.row - 1]]
    .filter(([c, r]) => r >= 0 && r < ROWS && c >= 0 && c < COLS && !blocked[r][c]);
  const [c, r] = spots[0] || [b.col, b.row + 1];
  a.status = 'talking'; a.errand = 'consult';
  a.text = text || ('→ ' + b.name); a.bubbleUntil = performance.now() + 9000;
  links.push({a: fromId, b: toId, until: performance.now() + 12000});
  goTo(a, c, r, () => {
    a.dir = b.col > a.col ? 'right' : b.col < a.col ? 'left' : b.row > a.row ? 'down' : 'up';
    b.bubble2 = '…'; b.bubble2Until = performance.now() + 2500;
    setTimeout(() => { if (a.errand === 'consult') { a.status = 'idle'; goHome(a); } }, 3000);
  });
}
const links = [];

function setAgents(list) {
  const keep = new Set(list.map(d => d.id));
  for (const id of [...agents.keys()]) if (!keep.has(id)) agents.delete(id);
  let i = 0;
  for (const d of list) {
    if (agents.has(d.id)) { const a = agents.get(d.id); a.name = d.name; a.role = d.role || a.role; if (!d.manager) i++; continue; }
    agents.set(d.id, makeAgent(d, d.manager ? 0 : i));
    if (!d.manager) i++;
  }
}

// ── Update ───────────────────────────────────────────────────────────
const SPEED = 46; // px/s
function update(dt, now) {
  for (const a of agents.values()) {
    if (a.path.length) {
      const [nc, nr] = a.path[0], tx = nc * T, ty = nr * T;
      const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy), step = SPEED * dt;
      a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      if (d <= step) { a.x = tx; a.y = ty; a.col = nc; a.row = nr; a.path.shift(); if (!a.path.length && a.onArrive) { const f = a.onArrive; a.onArrive = null; f(); } }
      else { a.x += dx / d * step; a.y += dy / d * step; }
      a.anim += dt; a.frame = [0, 1, 2, 1][Math.floor(a.anim / 0.13) % 4];
      continue;
    }
    a.anim += dt;
    if (a.sitting && a.status === 'working') a.frame = 3 + Math.floor(a.anim / 0.28) % 2;
    else if (a.sitting && a.status === 'reading') a.frame = 5 + Math.floor(a.anim / 0.7) % 2;
    else if (a.sitting) a.frame = 7;
    else a.frame = 1;
    // idle agents get up now and then: coffee, a stroll, back to the desk
    if (a.status === 'idle' && !meeting?.has(a.id) && now > a.wanderAt) {
      a.wanderAt = now + rnd(14000, 30000);
      if (a.errand === 'stroll') { goHome(a); continue; }
      if (a.manager && Math.random() < .6) continue;
      const free = LOUNGE.filter(([c, r]) => ![...agents.values()].some(o => o !== a && o.col === c && o.row === r));
      const [c, r] = free[Math.floor(Math.random() * free.length)] || LOUNGE[0];
      a.errand = 'stroll';
      goTo(a, c, r, () => { a.dir = ['down','left','right'][Math.floor(Math.random() * 3)]; a.wanderAt = now + rnd(5000, 9000); });
    }
  }
  for (let i = links.length - 1; i >= 0; i--) if (links[i].until < now) links.splice(i, 1);
}

// ── Draw ─────────────────────────────────────────────────────────────
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 3, dpr = 1;
function resize() {
  const st = document.getElementById('stage'), r = st.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  scale = Math.max(1, Math.floor(Math.min(r.width / (COLS * T), r.height / (ROWS * T)) * dpr)) / dpr;
  if (scale * COLS * T > r.width) scale = r.width / (COLS * T);
  cv.style.width = COLS * T * scale + 'px'; cv.style.height = ROWS * T * scale + 'px';
  cv.width = Math.round(COLS * T * scale * dpr); cv.height = Math.round(ROWS * T * scale * dpr);
}
addEventListener('resize', resize);

const WALL_TOP = '#1a222d', WALL_FACE = '#2e3d52', WALL_EDGE = '#0c1117', WALL_TRIM = '#3d506b';
function drawFloorAndWalls() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = MAP[r][c], x = c * T, y = r * T;
    if (ch !== '#') { ctx.drawImage(img['floors:' + FLOOR[ch]], x, y); continue; }
    const floorBelow = !isWallTile(c, r + 1);
    ctx.fillStyle = floorBelow ? WALL_FACE : WALL_TOP; ctx.fillRect(x, y, T, T);
    if (floorBelow) { ctx.fillStyle = WALL_TRIM; ctx.fillRect(x, y + T - 2, T, 2); ctx.fillStyle = WALL_EDGE; ctx.fillRect(x, y, T, 1); }
    else {
      ctx.fillStyle = WALL_EDGE;
      if (!isWallTile(c - 1, r)) ctx.fillRect(x, y, 1, T);
      if (!isWallTile(c + 1, r)) ctx.fillRect(x + T - 1, y, 1, T);
    }
  }
  // floor shadow under the walls
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  for (let r = 1; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!isWallTile(c, r) && isWallTile(c, r - 1)) ctx.fillRect(c * T, r * T, T, 3);
}

function drawChar(a) {
  const im = img['chars:' + a.look], fr = a.frame, row = ROW_OF[a.dir];
  let x = Math.round(a.x), y = Math.round(a.y + T - 32);
  if (a.sitting && a.seat) { if (a.dir === 'up') y -= 6; else if (a.dir === 'down') y -= 2; else y -= 3; }
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x + 8, Math.round(a.y) + T - 2, 5, 2, 0, 0, 7); ctx.fill();
  if (a.dir === 'left') { ctx.save(); ctx.translate(x + 16, y); ctx.scale(-1, 1); ctx.drawImage(im, fr * 16, row * 32, 16, 32, 0, 0, 16, 32); ctx.restore(); }
  else ctx.drawImage(im, fr * 16, row * 32, 16, 32, x, y, 16, 32);
}

function drawChair(seat, key, flip) {
  const im = F(key); if (!im) return;
  const h = im.height, x = seat.col * T, y = seat.row * T + T - h;
  if (flip) { ctx.save(); ctx.translate(x + 16, y); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0); ctx.restore(); }
  else ctx.drawImage(im, x, y);
}

function frame(now) {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, COLS * T, ROWS * T);
  drawFloorAndWalls();

  // depth-sorted drawables: furniture, PCs, chairs, characters
  const items = [];
  for (const [k, c, r] of FURN) { const [w, h] = ASSETS.size[k]; items.push({z: r * T + h, d: () => ctx.drawImage(F(k), c * T, r * T)}); }
  const busySeat = s => [...agents.values()].find(a => a.home === s);
  for (const s of [...DESK_SEATS, MANAGER_SEAT]) {
    const owner = busySeat(s), on = owner && owner.sitting && owner.seat === s && (owner.status === 'working' || owner.status === 'reading' || owner.status === 'waiting');
    const pc = on ? 'PC_ON_' + (1 + Math.floor(now / 300) % 3) : 'PC_OFF';
    items.push({z: s.pc[1] * T + 32.5, d: () => ctx.drawImage(F(pc), s.pc[0] * T, s.pc[1] * T)});
    items.push({z: s.row * T + 1, d: () => drawChair(s, s.chair)});
  }
  for (const s of MEETING_SEATS) {
    const z = s.dir === 'down' ? s.row * T - 1 : s.dir === 'up' ? s.row * T + T + 1 : s.row * T + 1;
    items.push({z, d: () => drawChair(s, s.chair, s.dir === 'left')});
  }
  for (const a of agents.values()) items.push({z: a.y + T + (a.sitting && a.dir === 'down' ? -2 : 0), d: () => drawChar(a), a});
  items.sort((p, q) => p.z - q.z);
  for (const it of items) it.d();

  // consult links
  for (const l of links) {
    const a = agents.get(l.a), b = agents.get(l.b); if (!a || !b) continue;
    ctx.strokeStyle = 'rgba(139,92,246,.55)'; ctx.lineWidth = 1; ctx.setLineDash([2, 2]); ctx.lineDashOffset = -now / 60;
    ctx.beginPath(); ctx.moveTo(a.x + 8, a.y - 6); ctx.lineTo(b.x + 8, b.y - 6); ctx.stroke(); ctx.setLineDash([]);
  }

  // screen-space overlay: room labels, bubbles, names
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const S = scale;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = `700 ${Math.max(9, 3.2 * S)}px Inter,system-ui,sans-serif`;
  for (const r of ROOMS) {
    const nm = tt(r.name), tw = ctx.measureText(nm).width, x = (r.col * T + 2) * S, y = (r.row * T + 2) * S, h = Math.max(14, 5.5 * S);
    ctx.fillStyle = 'rgba(10,14,20,.55)'; roundRect(x, y, tw + 2.6 * S, h, h / 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText(nm, x + 1.3 * S, y + h / 2 + .5);
  }

  for (const a of agents.values()) {
    const cx = (a.x + 8) * S, top = (a.y + T - 34 - (a.sitting && a.dir === 'up' ? 6 : 0)) * S;
    let label = null, color = '#ffffff', ink = '#121820';
    if (a.status === 'waiting') { label = a.text || '?'; color = '#ffd166'; }
    else if (a.bubbleUntil > now && a.text) label = a.text;
    else if (a.bubble2Until > now) label = a.bubble2;
    else if (hover === a || selected === a) label = a.name;
    if (!label) continue;
    ctx.font = `600 ${Math.max(10, 3.4 * S)}px Inter,system-ui,sans-serif`;
    const tw = ctx.measureText(label).width, pad = Math.max(4, 1.6 * S), h = Math.max(16, 6 * S);
    const bx = Math.round(cx - tw / 2 - pad), by = Math.round(top - h - 2 * S + (a.status === 'waiting' ? Math.sin(now / 200) * S : 0));
    ctx.fillStyle = 'rgba(0,0,0,.25)'; roundRect(bx + 1, by + 2, tw + pad * 2, h, h / 3); ctx.fill();
    ctx.fillStyle = color; roundRect(bx, by, tw + pad * 2, h, h / 3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - S * 1.5, by + h); ctx.lineTo(cx, by + h + S * 1.8); ctx.lineTo(cx + S * 1.5, by + h); ctx.fill();
    ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.fillText(label, cx, by + h / 2 + .5); ctx.textAlign = 'left';
  }
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ── Pointer ──────────────────────────────────────────────────────────
let hover = null, selected = null;
const tip = document.getElementById('tip');
function agentAt(ev) {
  const r = cv.getBoundingClientRect(), wx = (ev.clientX - r.left) / scale, wy = (ev.clientY - r.top) / scale;
  let best = null;
  for (const a of agents.values()) if (wx >= a.x + 2 && wx <= a.x + 14 && wy >= a.y + T - 30 && wy <= a.y + T) if (!best || a.y > best.y) best = a;
  return best;
}
cv.addEventListener('mousemove', ev => {
  hover = agentAt(ev); cv.style.cursor = hover ? 'pointer' : 'default';
  if (!hover) { tip.style.display = 'none'; return; }
  const st = document.getElementById('stage').getBoundingClientRect();
  tip.innerHTML = `<b></b><span></span>`; tip.querySelector('b').textContent = hover.name;
  tip.querySelector('span').textContent = (hover.role ? hover.role + ' · ' : '') + STATUS_TEXT[hover.status];
  tip.style.display = 'block'; tip.style.left = ev.clientX - st.left + 14 + 'px'; tip.style.top = ev.clientY - st.top + 14 + 'px';
});
cv.addEventListener('mouseleave', () => { hover = null; tip.style.display = 'none'; });
cv.addEventListener('click', ev => {
  const a = agentAt(ev); selected = a;
  if (!a) return;
  const msg = {type: 'deskcrew-office:click', id: a.id};
  if (typeof api.onAgentClick === 'function') api.onAgentClick(a.id);
  if (window.parent !== window) window.parent.postMessage(msg, '*');
  if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
});

// ── Public API ───────────────────────────────────────────────────────
const api = window.DeskCrewOffice = {
  setAgents, setStatus, startMeeting, endMeeting, consult,
  getAgents: () => [...agents.values()].map(a => ({id: a.id, name: a.name, status: a.status})),
  onAgentClick: null,
};
// the desktop app can drive the office by message too (iframe, WebView2, Electron)
function onMessage(data) {
  if (!data || data.type !== 'deskcrew-office' || typeof api[data.action] !== 'function') return;
  api[data.action](...(data.args || []));
}
addEventListener('message', e => onMessage(e.data));
if (window.chrome && window.chrome.webview) window.chrome.webview.addEventListener('message', e => onMessage(e.data));

  [13500, () => { setStatus('gezgin', 'idle', tt('Dolar 41,2 TL (örnek)|USD/TRY 41.2 (sample)')); setStatus('posta', 'idle') }],
  [15000, () => { setStatus('dosyaci', 'idle'); setStatus('saat', 'idle') }],
  [16500, () => startMeeting()],
  [21500, () => { const m = agents.get('mudur'); if (m) { m.text = tt('Herkese teşekkürler!|Thanks, everyone!'); m.bubbleUntil = performance.now() + 3500 } }],
  [24500, () => endMeeting()],
  [29000, null],
];
function play() { for (const [t, f] of SCRIPT) setTimeout(f || play, t) }

// ── Boot ─────────────────────────────────────────────────────────────
loadAll().then(() => {
  resize();
  setAgents([
    {id:'mudur', name:tt('Müdür|Manager'), role:tt('Ekibi yönetir|Runs the team'), look:'mudur', manager:true},
    {id:'posta', name:tt('Posta|Mail'), role:tt('E-posta asistanı|Email assistant'), look:'posta'},
    {id:'gezgin', name:tt('Gezgin|Scout'), role:tt('Araştırmacı|Researcher'), look:'gezgin'},
    {id:'dosyaci', name:tt('Dosyacı|Files'), role:tt('Dosya düzenleyici|File organizer'), look:'dosyaci'},
    {id:'saat', name:tt('Saat|Clock'), role:tt('Zamanlanmış işler|Scheduled tasks'), look:'saat'},
    {id:'finans', name:tt('Finans|Finance'), role:tt('Fatura ve ödemeler|Bills and payments'), look:'operator'},
  ]);
  setTimeout(play, 1200);
  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt, now); frame(now);
    requestAnimationFrame(loop);
  })(last);
  if (window.parent !== window) window.parent.postMessage({type: 'deskcrew-office:ready'}, '*');
  if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({type: 'deskcrew-office:ready'});
});
})();
</script>
